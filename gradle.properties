org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mojang's launcher-meta endpoint is intermittently unreachable on this machine.
# NeoForm may use the BMCLAPI mirror for the launcher index; artifact checksums
# still come from Mojang's signed version metadata.
neoForge.neoFormRuntime.launcherManifestUrl=https://bmclapi2.bangbang93.com/mc/game/version_manifest_v2.json

# Minecraft 26.1 uses the new calendar-based version scheme and Java 25.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.95

mod_id=mantle
mod_name=Mantle (Unofficial 26.1 Port)
mod_license=MIT
mod_version=1.12.2
mod_group_id=slimeknights.mantle

# Optional JEI integration for NeoForge 26.1.2.
jei_version=29.21.0.66
jei_range=[29.21.0,)
